[workspace]
resolver = "3"
members = ["cage", "compiler/*"]

[workspace.dependencies]
ariadne = { version = "0.6" }
clap = { version = "4" }
ctrlc = { version = "3" }
cyc_macros = { path = "compiler/cyc_macros" }
darling = { version = "0.23" }
expect-test = { version = "1" }
indexmap = { version = "2" }
insta = { version = "1" }
memchr = { version = "2" }
proc-macro2 = { version = "1" }
quote = { version = "1" }
syn = { version = "2" }
thiserror = { version = "2" }
unicode-ident = { version = "1" }
