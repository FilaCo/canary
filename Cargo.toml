[workspace]
resolver = "3"
members = [
    "chorus",
    "compiler/cyc",
    "compiler/cyc_diag",
    "compiler/cyc_ir",
    "compiler/cyc_lexer",
    "compiler/cyc_macros",
]

[workspace.dependencies]
annotate-snippets = { version = "0.12" }
clap = { version = "4" }
ctrlc = { version = "3" }
cyc_diag = { path = "compiler/cyc_diag" }
cyc_ir = { path = "compiler/cyc_ir" }
cyc_lexer = { path = "compiler/cyc_lexer" }
cyc_macros = { path = "compiler/cyc_macros" }
darling = { version = "0.23" }
expect-test = { version = "1" }
indexmap = { version = "2" }
insta = { version = "1" }
memchr = { version = "2" }
proc-macro2 = { version = "1" }
quote = { version = "1" }
syn = { version = "2" }
thiserror = { version = "2" }
unicode-ident = { version = "1" }
yansi = { version = "1" }
